
name: Generate Interferometry Graphs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'interferometry_analysis.py'
      - 'interferometry - *.csv'
      - '.github/workflows/run-analysis.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install numpy scipy matplotlib

      - name: Generate figures and calculations
        run: |
          python interferometry_analysis.py --data-dir . --out results

      - name: Commit updated figures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A results/

          if ! git diff --cached --quiet; then
            git commit -m "Regenerate interferometry figures"
            git push
          else
            echo "No changes to generated results"
          fi
